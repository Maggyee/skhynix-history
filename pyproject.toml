[project]
name = "skhynix-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27", "tenacity>=9", "pandas>=2.2", "numpy>=2",
  "pyarrow>=17", "duckdb>=1.1", "matplotlib>=3.9", "seaborn>=0.13",
  "jinja2>=3.1", "pyyaml>=6", "exchange-calendars>=4.6", "scipy>=1.14"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skhynix-research = "skhynix_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skhynix_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]

