start: "2026-06-10T05:50:00Z"
symbols:
  hyperliquid: "xyz:SKHX"
  binance: "SKHYNIXUSDT"
  bitget: "SKHYNIXUSDT"
  okx: "SKHYNIX-USDT-SWAP"
  gate: "SKHYNIX_USDT"
http:
  timeout_seconds: 25
  max_attempts: 5
  min_interval_seconds: 0.08

live_bbo:
  stale_after_ms: 3000
  max_cross_exchange_skew_ms: 1500
  heartbeat_seconds: 20
  reconnect_min_seconds: 1
  reconnect_max_seconds: 30
  parquet_flush_seconds: 5
  parquet_batch_rows: 500

paper_bbo:
  pairs: ["binance/gate", "bitget/gate", "gate/hyperliquid", "gate/okx"]
  allowed_regimes: ["NORMAL", "TRANSIENT_DISLOCATION"]
  entry_thresholds_bps: [100, 150, 200, 250, 300]
  confirmation_seconds: 5
  gross_notional_usd: 1000
  research_thresholds_bps: [100, 150, 200, 250, 300]
  research_confirmation_seconds: [1, 3, 5, 10]
  research_first_level_notionals_usd: [100, 500, 1000]
  max_open_positions: 1
  exit_spread_bps: 20
  max_holding_seconds: 86400
  # Conservative research assumptions, bps per taker fill; not fee-tier claims.
  taker_fee_bps:
    binance: 10
    bitget: 10
    gate: 10
    hyperliquid: 10
    okx: 10
  slippage_bps_per_fill: 2
  safety_buffer_bps: 10
